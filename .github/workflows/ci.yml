name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm ci
        working-directory: ./rfq-marketplace
      - name: Run tests
        run: npm test
        working-directory: ./rfq-marketplace
