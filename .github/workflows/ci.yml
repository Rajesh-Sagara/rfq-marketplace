name: CI
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install deps
        run: npm ci
        
      - name: Run tests
        run: npm test
        
      - name: Run tests
        env:
          JWT_SECRET: test_jwt_secret_key_123
          DATABASE_URL: postgres://postgres:postgres@localhost:5432/test_db
        run: npm test  